# 完整 spigot.yml 替换代码
config-version: 8
settings:
  debug: false
  save-user-cache-on-stop-only: false
  bungeecord: false # 如果你用 BungeeCord 跨服，请务必改为 true
  late-bind: false
  sample-count: 12
  player-shuffle: 0
  filter-creative-items: true
  user-cache-size: 1000
  int-cache-limit: 1024
  moved-wrongly-threshold: 0.0625
  moved-too-quickly-multiplier: 10.0
  item-dirty-ticks: 20
  timeout-time: 60
  restart-on-crash: true
  restart-script: ./start.sh
  netty-threads: 4
  attribute:
    maxHealth: { max: 2048.0 }
    movementSpeed: { max: 2048.0 }
    attackDamage: { max: 2048.0 }
messages:
  whitelist: You are not whitelisted on this server!
  unknown-command: Unknown command. Type "/help" for help.
  server-full: The server is full!
  outdated-client: Outdated client! Please use {0}
  outdated-server: Outdated server! I'm still on {0}
  restart: Server is restarting
commands:
  tab-complete: 0
  log: true
  spam-exclusions:
  - /skill
  replace-commands:
  - setblock
  - summon
  - testforblock
  - tellraw
stats:
  disable-saving: true
  forced-stats: {}
world-settings:
  default:
    verbose: false
    mob-spawn-range: 1
    entity-activation-range:
      animals: 2
      monsters: 2
      misc: 2
    entity-tracking-range:
      players: 48 # 玩家可见距离
      animals: 2
      monsters: 2
      misc: 2
      other: 2
    ticks-per:
      hopper-transfer: 24
      hopper-check: 24
    hopper-amount: 1
    random-light-updates: false # 关闭随机光照更新
    save-structure-info: false # 关闭结构保存
    dragon-death-sound-radius: 0
    seed-village: 10387312
    seed-feature: 14357617
    hunger:
      jump-walk-exhaustion: 0.05
      jump-sprint-exhaustion: 0.2
      combat-exhaustion: 0.1
      regen-exhaustion: 6.0
      swim-multiplier: 0.01
      sprint-multiplier: 0.1
      other-multiplier: 0.0
    max-tnt-per-tick: 10
    max-tick-time:
      tile: 10
      entity: 10
    item-despawn-rate: 1200
    merge-radius:
      item: 4.0
      exp: 6.0
    arrow-despawn-rate: 300
    enable-zombie-pigmen-portal-spawns: false
    wither-spawn-sound-radius: 0
    view-distance: 2 # 极小视距，减轻区块加载压力
    hanging-tick-frequency: 100
    zombie-aggressive-towards-villager: false
    nerf-spawner-mobs: true
