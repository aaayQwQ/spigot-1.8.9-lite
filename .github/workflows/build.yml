name: Test BuildTools

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:

    - name: Java 8
      uses: actions/setup-java@v5
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Download
      run: |
        wget -O BuildTools.jar https://hub.spigotmc.org/jenkins/job/BuildTools/8/artifact/target/BuildTools.jar
        ls -lh BuildTools.jar

    - name: Run
      run: |
        java -jar BuildTools.jar --rev 1.8.9
