name: Build Spigot 1.8.9 Lite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Setup Java 8
      uses: actions/setup-java@v5
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Install tools
      run: |
        sudo apt update
        sudo apt install -y git maven wget

    - name: Download BuildTools
      run: |
        wget -O BuildTools.jar https://hub.spigotmc.org/jenkins/job/BuildTools/8/artifact/target/BuildTools.jar

    - name: Prepare Jacobe
      run: |
        mkdir -p ~/.buildtools
        mkdir -p ~/.buildtools/jacobe
        touch ~/.buildtools/jacobe/jacobe.jar

    - name: Build Spigot
      run: |
        java -jar BuildTools.jar --rev 1.8.9

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: spigot-1.8.9-lite
        path: spigot-1.8.9.jar
