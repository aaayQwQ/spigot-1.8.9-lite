name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ⭐ 用系统 Gradle（不再依赖 gradlew）
      - name: 安装 Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle

      # ⭐ 生成精简配置（关闭所有非必需功能）
      - name: 生成 gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.daemon=true
          minecraft_version=1.20.1
          loader_version=0.14.24
          mod_version=1.0.0
          maven_group=com.your.mod
          archives_base_name=your-mod-name
          # 功能开关（全部关闭，只保留最核心）
          fabric_api_enabled=false
          cloth_config_enabled=false
          data_generation_enabled=false
          EOF

      # ⭐ 编译（跳过测试）
      - name: 编译 Mod
        run: |
          gradle build -x test

      # ⭐ 查看生成的 JAR 体积
      - name: 查看编译产物
        run: |
          ls -lh build/libs/

      # ⭐ 上传 JAR
      - name: 上传 JAR
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
