name: Build RootLook

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 创建 RootLook.java
        run: |
          mkdir -p src/main/java
          cat > src/main/java/RootLook.java << 'EOF'
          import java.io.File;
          import java.nio.file.Files;
          java.nio.file.Path;
          java.nio.file.Paths;
          java.nio.file.attribute.PosixFileAttributes;
          java.nio.file.attribute.PosixFilePermission;
          java.util.Set;

          public class RootLook {
              public static void main(String[] args) {
                  System.out.println("========================================");
                  System.out.println("  RootLook - Minecraft 权限检测工具");
                  System.out.println("========================================");
                  System.out.println();

                  boolean isRoot = checkRoot();

                  if (isRoot) {
                      System.out.println("⚠️  当前服务器运行在 ROOT 权限下！");
                      System.out.println("   建议：使用普通用户运行 Minecraft 服务端");
                      System.out.println("   命令: sudo -u minecraft java -jar server.jar");
                  } else {
                      System.out.println("✅ 当前服务器未运行在 ROOT 权限下");
                      System.out.println("   安全状态：良好");
                  }

                  System.out.println();
                  System.out.println("========================================");
                  System.exit(isRoot ? 1 : 0);
              }

              private static boolean checkRoot() {
                  String userName = System.getProperty("user.name");
                  System.out.println("当前用户: " + userName);
                  if ("root".equals(userName)) {
                      return true;
                  }

                  try {
                      File rootDir = new File("/root");
                      if (rootDir.exists() && rootDir.canWrite()) {
                          System.out.println("   - 可以写入 /root 目录");
                          return true;
                      }
                  } catch (Exception e) {}

                  try {
                      Path shadow = Paths.get("/etc/shadow");
                      if (Files.exists(shadow)) {
                          if (Files.getFileStore(shadow).supportsFileAttributeView("posix")) {
                              PosixFileAttributes attrs = Files.readAttributes(shadow, PosixFileAttributes.class);
                              Set<PosixFilePermission> perms = attrs.permissions();
                              if (perms.contains(PosixFilePermission.OWNER_READ) ||
                                  perms.contains(PosixFilePermission.OTHERS_READ)) {
                                  try {
                                      Files.readAllLines(shadow);
                                      System.out.println("   - 可以读取 /etc/shadow (敏感文件)");
                                      return true;
                                  } catch (Exception e) {}
                              }
                          }
                      }
                  } catch (Exception e) {}

                  try {
                      Process process = Runtime.getRuntime().exec(new String[]{"whoami"});
                      String result = new String(process.getInputStream().readAllBytes()).trim();
                      System.out.println("   - whoami 结果: " + result);
                      if ("root".equals(result)) {
                          return true;
                      }
                  } catch (Exception e) {}

                  try {
                      File testFile = new File("/root/.rootlook_test");
                      if (testFile.createNewFile()) {
                          testFile.delete();
                          System.out.println("   - 可以在 /root 目录创建文件");
                          return true;
                      }
                  } catch (Exception e) {}

                  return false;
              }
          }
          EOF

      - name: 创建 build.gradle
        run: |
          cat > build.gradle << 'EOF'
          plugins {
              id 'java'
          }

          group = 'com.rootlook'
          version = '1.0.0'

          sourceCompatibility = JavaVersion.VERSION_17
          targetCompatibility = JavaVersion.VERSION_17

          repositories {
              mavenCentral()
          }

          jar {
              manifest {
                  attributes(
                      'Main-Class': 'RootLook'
                  )
              }
          }
          EOF

      # ⭐ 用 Gradle 来打包（更可靠）
      - name: 创建 settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          rootProject.name = 'RootLook'
          EOF

      - name: 编译并打包（使用 Gradle Wrapper）
        run: |
          # 生成 gradle wrapper
          mkdir -p gradle/wrapper
          echo '#!/bin/sh' > gradlew
          echo 'exec java -cp "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"' >> gradlew
          chmod +x gradlew
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.5/gradle/wrapper/gradle-wrapper.jar
          cat > gradle/wrapper/gradle-wrapper.properties << 'PROPS'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROPS
          # 执行编译
          ./gradlew build

      - name: 查看产物
        run: |
          ls -lh build/libs/

      - name: 测试运行
        run: |
          java -jar build/libs/RootLook.jar || true

      - name: 上传 JAR
        uses: actions/upload-artifact@v4
        with:
          name: RootLook
          path: build/libs/*.jar
