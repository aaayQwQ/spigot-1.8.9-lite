name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ⭐ 直接在 .yaml 里生成 gradle.properties（精简配置）
      - name: 生成精简版 gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          # Gradle 配置
          org.gradle.jvmargs=-Xmx2G
          org.gradle.daemon=true

          # Minecraft 版本
          minecraft_version=1.20.1
          loader_version=0.14.24

          # Mod 信息
          mod_version=1.0.0
          maven_group=com.your.mod
          archives_base_name=your-mod-name

          # ⭐ 功能开关（全部关闭，只保留最核心功能）
          fabric_api_enabled=false
          cloth_config_enabled=false
          data_generation_enabled=false
          test_mod_enabled=false
          EOF

      # ⭐ 如果仓库里没有 gradlew，自动生成
      - name: 生成 gradlew
        run: |
          if [ ! -f "gradlew" ]; then
            mkdir -p gradle/wrapper
            cat > gradlew << 'GRADLEW'
            #!/bin/sh
            exec java -cp "\$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "\$@"
            GRADLEW
            chmod +x gradlew
            curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.0.0/gradle/wrapper/gradle-wrapper.jar
            cat > gradle/wrapper/gradle-wrapper.properties << 'PROPS'
            distributionBase=GRADLE_USER_HOME
            distributionPath=wrapper/dists
            distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-bin.zip
            zipStoreBase=GRADLE_USER_HOME
            zipStorePath=wrapper/dists
            PROPS
          else
            chmod +x gradlew
          fi

      # ⭐ 编译并跳过测试
      - name: 编译
        run: |
          ./gradlew build -x test

      # ⭐ 查看生成的 jar 文件大小
      - name: 查看 JAR 文件
        run: |
          ls -lh build/libs/

      # ⭐ 上传 JAR
      - name: 上传 JAR
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
