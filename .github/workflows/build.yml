name: Build RootLook

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ⭐ 直接把修复好的 RootLook.java 写入仓库
      - name: 创建 RootLook.java
        run: |
          mkdir -p src/main/java
          cat > src/main/java/RootLook.java << 'EOF'
          import java.io.File;
          import java.io.IOException;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.nio.file.Paths;
          import java.nio.file.attribute.PosixFileAttributes;
          import java.nio.file.attribute.PosixFilePermission;
          import java.util.Set;

          public class RootLook {
              public static void main(String[] args) {
                  System.out.println("========================================");
                  System.out.println("  RootLook - Minecraft 权限检测工具");
                  System.out.println("========================================");
                  System.out.println();

                  boolean isRoot = checkRoot();

                  if (isRoot) {
                      System.out.println("⚠️  当前服务器运行在 ROOT 权限下！");
                      System.out.println("   建议：使用普通用户运行 Minecraft 服务端");
                      System.out.println("   命令: sudo -u minecraft java -jar server.jar");
                  } else {
                      System.out.println("✅ 当前服务器未运行在 ROOT 权限下");
                      System.out.println("   安全状态：良好");
                  }

                  System.out.println();
                  System.out.println("========================================");
                  System.exit(isRoot ? 1 : 0);
              }

              private static boolean checkRoot() {
                  String userName = System.getProperty("user.name");
                  System.out.println("当前用户: " + userName);
                  if ("root".equals(userName)) {
                      return true;
                  }

                  try {
                      File rootDir = new File("/root");
                      if (rootDir.exists() && rootDir.canWrite()) {
                          System.out.println("   - 可以写入 /root 目录");
                          return true;
                      }
                  } catch (Exception e) {}

                  try {
                      Path shadow = Paths.get("/etc/shadow");
                      if (Files.exists(shadow)) {
                          try {
                              Files.readAllLines(shadow);
                              System.out.println("   - 可以读取 /etc/shadow (敏感文件)");
                              return true;
                          } catch (IOException e) {}
                      }
                  } catch (Exception e) {}

                  try {
                      Process process = Runtime.getRuntime().exec(new String[]{"whoami"});
                      String result = new String(process.getInputStream().readAllBytes()).trim();
                      System.out.println("   - whoami 结果: " + result);
                      if ("root".equals(result)) {
                          return true;
                      }
                  } catch (Exception e) {}

                  try {
                      File testFile = new File("/root/.rootlook_test");
                      if (testFile.createNewFile()) {
                          testFile.delete();
                          System.out.println("   - 可以在 /root 目录创建文件");
                          return true;
                      }
                  } catch (Exception e) {}

                  String uid = System.getenv("UID");
                  if ("0".equals(uid)) {
                      System.out.println("   - 环境变量 UID=0 (root)");
                      return true;
                  }

                  return false;
              }
          }
          EOF

      # ⭐ 直接用 javac 编译（不需要 Gradle）
      - name: 编译 RootLook
        run: |
          mkdir -p build/classes
          javac -d build/classes src/main/java/RootLook.java

      # ⭐ 打包成可执行 JAR
      - name: 打包 JAR
        run: |
          mkdir -p build/libs
          jar -cfe build/libs/RootLook.jar RootLook -C build/classes .

      # ⭐ 查看产物
      - name: 查看产物
        run: |
          ls -lh build/libs/

      # ⭐ 测试运行（退出码 1 表示检测到 root，这里允许失败）
      - name: 测试运行
        run: |
          java -jar build/libs/RootLook.jar || true

      # ⭐ 上传 JAR
      - name: 上传 JAR
        uses: actions/upload-artifact@v4
        with:
          name: RootLook
          path: build/libs/RootLook.jar
