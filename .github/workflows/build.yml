name: Build Spigot 1.8.9 Lite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Setup Java 8
      uses: actions/setup-java@v5
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Install tools
      run: |
        sudo apt update
        sudo apt install -y git maven

    - name: Clone Spigot sources
      run: |
        git clone https://hub.spigotmc.org/stash/scm/spigot/builddata.git BuildData
        git clone https://hub.spigotmc.org/stash/scm/spigot/bukkit.git Bukkit
        git clone https://hub.spigotmc.org/stash/scm/spigot/craftbukkit.git CraftBukkit
        git clone https://hub.spigotmc.org/stash/scm/spigot/spigot.git Spigot

    - name: Checkout 1.8.9 commits
      run: |
        cd Bukkit
        git checkout a176036de14dbd873fcfed8f3111723cdb34e12c

        cd ../CraftBukkit
        git checkout efaae75af2758baf9cc24ecbf54eb13fee1f06f7

        cd ../Spigot
        git checkout 8db49a2b72ef138a615856934957da2978f72f08

    - name: Apply patches
      run: |
        cd CraftBukkit
        ./applyPatches.sh

        cd ../Spigot
        ./applyPatches.sh

    - name: Build CraftBukkit
      run: |
        cd CraftBukkit
        mvn clean package install -DskipTests

    - name: Build Spigot
      run: |
        cd Spigot
        mvn clean package install -DskipTests

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: spigot-1.8.9-lite
        path: Spigot/target/spigot-*.jar
