name: Build Spigot 1.8.9 Lite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Java 8
      uses: actions/setup-java@v5
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git maven

    - name: Download BuildTools
      run: |
        wget https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar

    - name: Prepare Jacobe
      run: |
        mkdir -p ~/.m2/repository/org/spigotmc
        touch jacobe.linux.tar.gz

    - name: Build Spigot 1.8.9
      run: |
        java -jar BuildTools.jar --rev 1.8.9 --disable-java-check

    - name: Upload Spigot Jar
      uses: actions/upload-artifact@v4
      with:
        name: spigot-1.8.9-lite
        path: spigot-1.8.9.jar
